<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clube Florescer — QR Expo Go</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #eef0eb;
      color: #1a1a1a;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    p { color: #5f5f5c; font-size: 0.92rem; line-height: 1.5; }
    .qr-wrap {
      margin: 20px auto 16px;
      padding: 16px;
      background: #fff;
      border: 1px solid #e4e4e0;
      border-radius: 16px;
      display: inline-block;
    }
    img { display: block; }
    code {
      display: block;
      margin-top: 12px;
      padding: 10px 12px;
      background: #eef0eb;
      border-radius: 12px;
      font-size: 0.82rem;
      word-break: break-all;
      color: #1a1a1a;
    }
    ol {
      text-align: left;
      margin-top: 20px;
      padding-left: 20px;
      font-size: 0.88rem;
      color: #5f5f5c;
    }
    li { margin: 6px 0; }
    .hint {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: #eef0eb;
      border: 1px solid #8b967c;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Expo Go — Clube Florescer</h1>
    <p>Escaneie com o app <strong>Expo Go</strong> (mesma Wi‑Fi do PC).</p>
    <div class="qr-wrap">
      <img id="qr" width="260" height="260" alt="QR Code Expo" />
    </div>
    <code id="url">Carregando…</code>
    <ol>
      <li>Abra o <strong>Expo Go</strong> no celular.</li>
      <li>Toque em <strong>Scan QR code</strong>.</li>
      <li>Aponte para o QR acima (ou digite a URL manualmente).</li>
    </ol>
    <p class="hint">Backend local: porta <strong>3001</strong>. PC e celular na mesma rede Wi‑Fi.</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const host = params.get('host') || location.hostname;
    const port = params.get('port') || '8081';
    const expUrl = `exp://${host}:${port}`;
    const qrImg = document.getElementById('qr');
    const urlEl = document.getElementById('url');

    urlEl.textContent = expUrl;
    qrImg.src =
      'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' +
      encodeURIComponent(expUrl);
  </script>
</body>
</html>
