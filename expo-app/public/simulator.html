<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clube Florescer — iPhone Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1d1d1f;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      overflow: hidden;
    }

    .sim {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform-origin: center center;
    }

    .title-bar {
      display: flex;
      align-items: center;
      background: rgba(58, 58, 60, 0.95);
      border-radius: 10px;
      padding: 0 14px;
      height: 36px;
      gap: 10px;
      width: 100%;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .dots { display: flex; gap: 7px; align-items: center; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }

    .title-text {
      flex: 1;
      text-align: center;
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.1px;
    }

    .spacer { width: 46px; }

    .phone-wrap {
      position: relative;
      width: 415px;
    }

    .btn-power {
      position: absolute;
      right: -4px;
      top: 181px;
      width: 4px;
      height: 88px;
      background: linear-gradient(to right, #303034, #505056, #303034);
      border-radius: 0 3px 3px 0;
      box-shadow: 2px 1px 4px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .btn-vol-up {
      position: absolute;
      left: -4px;
      top: 141px;
      width: 4px;
      height: 62px;
      background: linear-gradient(to left, #303034, #505056, #303034);
      border-radius: 3px 0 0 3px;
      box-shadow: -2px 1px 4px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .btn-vol-down {
      position: absolute;
      left: -4px;
      top: 219px;
      width: 4px;
      height: 62px;
      background: linear-gradient(to left, #303034, #505056, #303034);
      border-radius: 3px 0 0 3px;
      box-shadow: -2px 1px 4px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .btn-mute {
      position: absolute;
      left: -4px;
      top: 97px;
      width: 4px;
      height: 36px;
      background: linear-gradient(to left, #303034, #505056, #303034);
      border-radius: 3px 0 0 3px;
      box-shadow: -2px 1px 4px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .phone {
      width: 100%;
      border-radius: 56px;
      padding: 11px;
      overflow: hidden;
      clip-path: inset(0 round 56px);
      background: linear-gradient(
        145deg,
        #5a5a5e 0%,
        #3a3a3e 10%,
        #242426 35%,
        #1e1e20 55%,
        #2a2a2e 75%,
        #424246 90%,
        #525256 100%
      );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06),
        inset 1px 0 0 rgba(255, 255, 255, 0.08),
        inset -1px 0 0 rgba(255, 255, 255, 0.08),
        0 50px 120px rgba(0, 0, 0, 0.95),
        0 20px 50px rgba(0, 0, 0, 0.7),
        0 6px 16px rgba(0, 0, 0, 0.5);
    }

    .screen {
      width: 100%;
      height: 830px;
      background: #000;
      border-radius: 45px;
      overflow: hidden;
      position: relative;
    }

    .island {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 114px;
      height: 28px;
      background: #000;
      border-radius: 15px;
      z-index: 12;
      pointer-events: none;
    }

    .status {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      padding: 0 24px;
      justify-content: space-between;
      z-index: 11;
      pointer-events: none;
      transition: background 0.3s, color 0.3s;
    }

    .clock {
      font-size: 15px;
      font-weight: 600;
      color: currentColor;
      letter-spacing: -0.2px;
    }

    .icons { display: flex; align-items: center; gap: 6px; }

    .app-frame {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background: #f7f6f2;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f7f6f2;
    }

    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: 132px;
      height: 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      z-index: 13;
      pointer-events: none;
      transition: background 0.3s;
    }

    .home-indicator.dark {
      background: rgba(255, 255, 255, 0.42);
    }

    .boot {
      position: absolute;
      inset: 44px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: #f7f6f2;
      z-index: 9;
    }

    .boot.hidden { display: none; }

    .boot-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(139, 150, 124, 0.25);
      border-top-color: #8b967c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .boot-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .boot-copy {
      font-size: 12px;
      line-height: 1.45;
      color: #6e6e73;
      max-width: 260px;
    }

    .boot code {
      display: inline-block;
      margin-top: 4px;
      padding: 0.35rem 0.55rem;
      border-radius: 8px;
      background: #eef0eb;
      font-size: 11px;
      word-break: break-all;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="sim" id="sim">
    <div class="title-bar">
      <div class="dots">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
      </div>
      <span class="title-text">Clube Florescer &nbsp;·&nbsp; iPhone 17 Pro</span>
      <div class="spacer"></div>
    </div>

    <div class="phone-wrap">
      <div class="btn-mute"></div>
      <div class="btn-vol-up"></div>
      <div class="btn-vol-down"></div>
      <div class="btn-power"></div>

      <div class="phone">
        <div class="screen">
          <div class="island"></div>

          <div class="status" id="status">
            <span class="clock" id="clock"></span>
            <div class="icons">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true">
                <rect x="0" y="8" width="3" height="4" rx="0.5" />
                <rect x="4" y="5.5" width="3" height="6.5" rx="0.5" />
                <rect x="8" y="3" width="3" height="9" rx="0.5" />
                <rect x="12" y="0" width="3" height="12" rx="0.5" />
              </svg>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                <path d="M8 10.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
                <path d="M5 7.8C5.8 7 6.8 6.5 8 6.5s2.2.5 3 1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                <path d="M2.5 5.2C4 3.7 5.9 2.8 8 2.8s4 .9 5.5 2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              </svg>
              <svg width="26" height="12" viewBox="0 0 26 12" fill="none" aria-hidden="true">
                <rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.5" />
                <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor" />
                <path d="M23.5 4v4a2 2 0 000-4z" fill="currentColor" fill-opacity="0.4" />
              </svg>
            </div>
          </div>

          <div class="boot" id="boot">
            <div class="boot-spinner"></div>
            <p class="boot-title">Carregando app…</p>
            <p class="boot-copy">
              Aguardando o Expo Web em
              <code id="boot-url"></code>
              <br /><br />
              Rode <code>npm run dev:expo</code> e pressione <strong>w</strong> no terminal se a tela ficar em branco.
            </p>
          </div>

          <div class="app-frame">
            <iframe
              id="app"
              title="Clube Florescer"
              allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>

          <div class="home-indicator" id="home-indicator"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const defaultAppUrl = `${location.protocol}//${location.hostname || '127.0.0.1'}:8081`;
    const appUrl = (params.get('app') || defaultAppUrl).replace(/\/$/, '');

    const iframe = document.getElementById('app');
    const boot = document.getElementById('boot');
    const bootUrl = document.getElementById('boot-url');
    const status = document.getElementById('status');
    const homeIndicator = document.getElementById('home-indicator');

    bootUrl.textContent = appUrl;
    iframe.src = appUrl;

    let loaded = false;
    iframe.addEventListener('load', () => {
      loaded = true;
      boot.classList.add('hidden');
    });

    setTimeout(() => {
      if (!loaded) boot.classList.remove('hidden');
    }, 12000);

    function tick() {
      const n = new Date();
      document.getElementById('clock').textContent =
        n.getHours().toString().padStart(2, '0') + ':' +
        n.getMinutes().toString().padStart(2, '0');
    }
    tick();
    setInterval(tick, 1000);

    function scale() {
      const totalH = 36 + 10 + 11 + 830 + 11;
      const s = Math.min(
        (innerHeight - 20) / totalH,
        (innerWidth - 20) / 415,
        1,
      );
      document.getElementById('sim').style.transform = `scale(${s})`;
    }
    scale();
    addEventListener('resize', scale);

    window.addEventListener('message', (e) => {
      if (e.data?.type !== 'mockup-theme') return;
      status.style.background = e.data.background || '#fff';
      status.style.color = e.data.isDark ? '#fff' : '#000';
      homeIndicator.classList.toggle('dark', Boolean(e.data.isDark));
    });
  </script>
</body>
</html>
