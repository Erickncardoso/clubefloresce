# Referência local / Coolify Docker Compose (opcional).
# Produção: preferir app Dockerfile no Coolify (base dir whisper/).

services:
  whisper:
    build: .
    image: clubefloresce-whisper:medium-cpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WHISPER__MODEL: Systran/faster-whisper-medium
      WHISPER__INFERENCE_DEVICE: cpu
    volumes:
      - whisper_models:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 6G

volumes:
  whisper_models:
