# Esteira Coolify — Clube Florescer (backend + admin + PWA paciente)
#
# Deploy: SOMENTE via API (POST /api/v1/deploy) — NÃO usa webhook do Coolify.
# Push em main: só sincroniza/deploya apps cujos paths mudaram.
# workflow_dispatch: escolha manual por app.
#
# Secrets obrigatórios:
#   COOLIFY_URL, COOLIFY_TOKEN
#   COOLIFY_BACKEND_UUID, COOLIFY_FRONTEND_UUID, COOLIFY_CLIENTE_UUID
#
# Secrets de app (opcional): ver ops/coolify/*.env.list

name: Deploy Coolify

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "expo-app/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:
    inputs:
      sync_envs:
        description: "Sincronizar envs no Coolify antes do deploy"
        type: boolean
        default: true
      deploy_backend:
        description: "Deploy backend (API)"
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy admin (Next)"
        type: boolean
        default: true
      deploy_cliente:
        description: "Deploy PWA paciente (Nuxt)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-coolify-${{ github.ref }}
  cancel-in-progress: false

env:
  COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

jobs:
  changes:
    name: "0 · Detectar mudanças"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cliente: ${{ steps.filter.outputs.cliente }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'ops/coolify/backend.env.list'
            frontend:
              - 'frontend/**'
              - 'ops/coolify/frontend.env.list'
            cliente:
              - 'cliente/**'
              - 'frontend2/**'
              - 'ops/coolify/cliente.env.list'
            whisper:
              - 'whisper/**'

  gate:
    name: "1 · Gate"
    needs: changes
    if: always() && !cancelled() && (needs.changes.result == 'success' || needs.changes.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      sync_envs: ${{ steps.flags.outputs.sync_envs }}
      deploy_backend: ${{ steps.flags.outputs.deploy_backend }}
      deploy_frontend: ${{ steps.flags.outputs.deploy_frontend }}
      deploy_cliente: ${{ steps.flags.outputs.deploy_cliente }}
    steps:
      - name: Resolver flags da esteira
        id: flags
        env:
          COOLIFY_BACKEND_UUID: ${{ secrets.COOLIFY_BACKEND_UUID }}
          COOLIFY_FRONTEND_UUID: ${{ secrets.COOLIFY_FRONTEND_UUID }}
          COOLIFY_CLIENTE_UUID: ${{ secrets.COOLIFY_CLIENTE_UUID }}
          EVENT_NAME: ${{ github.event_name }}
          IN_SYNC: ${{ inputs.sync_envs }}
          IN_BE: ${{ inputs.deploy_backend }}
          IN_FE: ${{ inputs.deploy_frontend }}
          IN_CLI: ${{ inputs.deploy_cliente }}
          CHG_BE: ${{ needs.changes.outputs.backend }}
          CHG_FE: ${{ needs.changes.outputs.frontend }}
          CHG_CLI: ${{ needs.changes.outputs.cliente }}
        run: |
          set -euo pipefail
          missing=0
          for k in COOLIFY_URL COOLIFY_TOKEN COOLIFY_BACKEND_UUID COOLIFY_FRONTEND_UUID COOLIFY_CLIENTE_UUID; do
            if [ -z "${!k}" ]; then
              echo "::error::Secret $k não configurado."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Secrets Coolify OK."

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sync_envs="${IN_SYNC:-true}"
            deploy_backend="${IN_BE:-true}"
            deploy_frontend="${IN_FE:-true}"
            deploy_cliente="${IN_CLI:-true}"
          else
            sync_envs=true
            deploy_backend="${CHG_BE:-false}"
            deploy_frontend="${CHG_FE:-false}"
            deploy_cliente="${CHG_CLI:-false}"
          fi

          if [ "$deploy_backend" != "true" ] && [ "$deploy_frontend" != "true" ] && [ "$deploy_cliente" != "true" ]; then
            echo "Nenhum app afetado neste push — deploys pulados."
            sync_envs=false
          fi

          {
            echo "sync_envs=$sync_envs"
            echo "deploy_backend=$deploy_backend"
            echo "deploy_frontend=$deploy_frontend"
            echo "deploy_cliente=$deploy_cliente"
          } >>"$GITHUB_OUTPUT"

          {
            echo "## Clube Florescer · Esteira Coolify"
            echo
            echo "| App | Deploy? |"
            echo "| --- | --- |"
            echo "| Backend | \`$deploy_backend\` |"
            echo "| Frontend | \`$deploy_frontend\` |"
            echo "| Cliente | \`$deploy_cliente\` |"
            echo
            echo "| Contexto | Valor |"
            echo "| --- | --- |"
            echo "| Evento | \`$EVENT_NAME\` |"
            echo "| Sync envs | \`$sync_envs\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  sync-backend:
    name: "2 · Sync backend"
    needs: gate
    if: |
      needs.gate.result == 'success' &&
      needs.gate.outputs.sync_envs == 'true' &&
      needs.gate.outputs.deploy_backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      skipped: ${{ steps.sync.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync envs backend
        id: sync
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_BACKEND_UUID }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PORT: ${{ secrets.PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PRISMA_CLIENT_ENGINE_TYPE: ${{ secrets.PRISMA_CLIENT_ENGINE_TYPE }}
          PRISMA_CLI_QUERY_ENGINE_TYPE: ${{ secrets.PRISMA_CLI_QUERY_ENGINE_TYPE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_CHAT: ${{ secrets.OPENAI_MODEL_CHAT }}
          OPENAI_MODEL_VISION: ${{ secrets.OPENAI_MODEL_VISION }}
          OPENAI_MODEL_PDF: ${{ secrets.OPENAI_MODEL_PDF }}
          WHISPER_SELF_HOSTED: ${{ secrets.WHISPER_SELF_HOSTED }}
          WHISPER_API_BASE: ${{ secrets.WHISPER_API_BASE }}
          WHISPER_API_KEY: ${{ secrets.WHISPER_API_KEY }}
          OPENAI_TRANSCRIBE_URL: ${{ secrets.OPENAI_TRANSCRIBE_URL }}
          OPENAI_MODEL_WHISPER: ${{ secrets.OPENAI_MODEL_WHISPER }}
          OPENAI_TRANSCRIBE_TIMEOUT_MS: ${{ secrets.OPENAI_TRANSCRIBE_TIMEOUT_MS }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          MEDIA_VIDEO_PROVIDER: ${{ secrets.MEDIA_VIDEO_PROVIDER }}
          MEDIA_DOCUMENT_PROVIDER: ${{ secrets.MEDIA_DOCUMENT_PROVIDER }}
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_CDN_HOSTNAME: ${{ secrets.BUNNY_STREAM_CDN_HOSTNAME }}
          BUNNY_TRANSCRIPTION_LANG: ${{ secrets.BUNNY_TRANSCRIPTION_LANG }}
          BUNNY_STORAGE_ZONE_NAME: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_STORAGE_API_KEY }}
          BUNNY_STORAGE_CDN_HOSTNAME: ${{ secrets.BUNNY_STORAGE_CDN_HOSTNAME }}
          BUNNY_STORAGE_REGION: ${{ secrets.BUNNY_STORAGE_REGION }}
          BUNNY_STORAGE_DOCUMENTS_PREFIX: ${{ secrets.BUNNY_STORAGE_DOCUMENTS_PREFIX }}
          DOCUMENT_UPLOAD_MAX_MB: ${{ secrets.DOCUMENT_UPLOAD_MAX_MB }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          WUZAPI_SERVER_URL: ${{ secrets.WUZAPI_SERVER_URL }}
          WUZAPI_ADMIN_TOKEN: ${{ secrets.WUZAPI_ADMIN_TOKEN }}
          WUZAPI_USER_TOKEN: ${{ secrets.WUZAPI_USER_TOKEN }}
          WUZAPI_DEFAULT_USER_ID: ${{ secrets.WUZAPI_DEFAULT_USER_ID }}
          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY: ${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER: ${{ secrets.PUSHER_CLUSTER }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_CONTACT: ${{ secrets.EMAIL_FROM_CONTACT }}
          EMAIL_FROM_NOREPLY: ${{ secrets.EMAIL_FROM_NOREPLY }}
          EMAIL_LOGO_URL: ${{ secrets.EMAIL_LOGO_URL }}
          NUTRI_NOTIFICATION_EMAIL: ${{ secrets.NUTRI_NOTIFICATION_EMAIL }}
          PASSWORD_RESET_TTL_MINUTES: ${{ secrets.PASSWORD_RESET_TTL_MINUTES }}
          PATIENT_APP_URL: ${{ secrets.PATIENT_APP_URL }}
          ADMIN_APP_URL: ${{ secrets.ADMIN_APP_URL }}
          JITSI_BASE_URL: ${{ secrets.JITSI_BASE_URL }}
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_PUBLIC_KEY: ${{ secrets.MERCADOPAGO_PUBLIC_KEY }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          BILLING_SANDBOX_SIMULATE_CARD: ${{ secrets.BILLING_SANDBOX_SIMULATE_CARD }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${{ secrets.INSTAGRAM_WEBHOOK_VERIFY_TOKEN }}
          BACKBLAZE_B2_KEY_ID: ${{ secrets.BACKBLAZE_B2_KEY_ID }}
          BACKBLAZE_B2_APPLICATION_KEY: ${{ secrets.BACKBLAZE_B2_APPLICATION_KEY }}
          BACKBLAZE_B2_BUCKET_ID: ${{ secrets.BACKBLAZE_B2_BUCKET_ID }}
          BACKBLAZE_B2_BUCKET_NAME: ${{ secrets.BACKBLAZE_B2_BUCKET_NAME }}
          BACKBLAZE_B2_PUBLIC_URL: ${{ secrets.BACKBLAZE_B2_PUBLIC_URL }}
          BACKBLAZE_B2_WHATSAPP_PREFIX: ${{ secrets.BACKBLAZE_B2_WHATSAPP_PREFIX }}
        run: |
          chmod +x ops/coolify/sync-envs.sh ops/coolify/deploy.sh
          ./ops/coolify/sync-envs.sh ops/coolify/backend.env.list backend

  sync-frontend:
    name: "2 · Sync frontend"
    needs: gate
    if: |
      needs.gate.result == 'success' &&
      needs.gate.outputs.sync_envs == 'true' &&
      needs.gate.outputs.deploy_frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      skipped: ${{ steps.sync.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync envs frontend
        id: sync
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_FRONTEND_UUID }}
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_WHATSAPP_API_BASE: ${{ secrets.NEXT_PUBLIC_WHATSAPP_API_BASE }}
          NEXT_PUBLIC_BUNNY_STREAM_LIBRARY_ID: ${{ secrets.NEXT_PUBLIC_BUNNY_STREAM_LIBRARY_ID }}
          NODE_ENV: ${{ secrets.FRONTEND_NODE_ENV }}
          PORT: ${{ secrets.FRONTEND_PORT }}
        run: |
          chmod +x ops/coolify/sync-envs.sh ops/coolify/deploy.sh
          ./ops/coolify/sync-envs.sh ops/coolify/frontend.env.list frontend

  sync-cliente:
    name: "2 · Sync cliente"
    needs: gate
    if: |
      needs.gate.result == 'success' &&
      needs.gate.outputs.sync_envs == 'true' &&
      needs.gate.outputs.deploy_cliente == 'true'
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      skipped: ${{ steps.sync.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync envs cliente
        id: sync
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_CLIENTE_UUID }}
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_MOBILE_APP: ${{ secrets.NUXT_PUBLIC_MOBILE_APP }}
          NODE_ENV: ${{ secrets.CLIENTE_NODE_ENV }}
        run: |
          chmod +x ops/coolify/sync-envs.sh ops/coolify/deploy.sh
          ./ops/coolify/sync-envs.sh ops/coolify/cliente.env.list cliente

  deploy-backend:
    name: "3 · Deploy backend"
    needs: [gate, sync-backend]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.deploy_backend == 'true' &&
      (needs.sync-backend.result == 'success' || needs.sync-backend.result == 'skipped' || needs.sync-backend.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy + aguardar Coolify
        id: deploy
        timeout-minutes: 25
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_BACKEND_UUID }}
          COOLIFY_WAIT: "true"
          COOLIFY_WAIT_TIMEOUT: "1200"
          COOLIFY_WAIT_INTERVAL: "15"
        run: |
          chmod +x ops/coolify/deploy.sh
          ./ops/coolify/deploy.sh backend

  deploy-frontend:
    name: "3 · Deploy frontend"
    needs: [gate, sync-frontend, deploy-backend]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.deploy_frontend == 'true' &&
      (needs.sync-frontend.result == 'success' || needs.sync-frontend.result == 'skipped' || needs.sync-frontend.result == 'failure') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy + aguardar Coolify
        id: deploy
        timeout-minutes: 25
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_FRONTEND_UUID }}
          COOLIFY_WAIT: "true"
          COOLIFY_WAIT_TIMEOUT: "1200"
          COOLIFY_WAIT_INTERVAL: "15"
        run: |
          chmod +x ops/coolify/deploy.sh
          ./ops/coolify/deploy.sh frontend

  deploy-cliente:
    name: "3 · Deploy cliente"
    needs: [gate, sync-cliente, deploy-frontend]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.deploy_cliente == 'true' &&
      (needs.sync-cliente.result == 'success' || needs.sync-cliente.result == 'skipped' || needs.sync-cliente.result == 'failure') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy + aguardar Coolify
        id: deploy
        timeout-minutes: 25
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_CLIENTE_UUID }}
          COOLIFY_WAIT: "true"
          COOLIFY_WAIT_TIMEOUT: "1200"
          COOLIFY_WAIT_INTERVAL: "15"
        run: |
          chmod +x ops/coolify/deploy.sh
          ./ops/coolify/deploy.sh cliente

  summary:
    name: "4 · Resumo"
    needs:
      - gate
      - sync-backend
      - sync-frontend
      - sync-cliente
      - deploy-backend
      - deploy-frontend
      - deploy-cliente
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Montar painel da esteira
        env:
          GATE: ${{ needs.gate.result }}
          DEP_BE_FLAG: ${{ needs.gate.outputs.deploy_backend }}
          DEP_FE_FLAG: ${{ needs.gate.outputs.deploy_frontend }}
          DEP_CLI_FLAG: ${{ needs.gate.outputs.deploy_cliente }}
          SYNC_BE: ${{ needs.sync-backend.result }}
          SYNC_FE: ${{ needs.sync-frontend.result }}
          SYNC_CLI: ${{ needs.sync-cliente.result }}
          DEP_BE: ${{ needs.deploy-backend.result }}
          DEP_FE: ${{ needs.deploy-frontend.result }}
          DEP_CLI: ${{ needs.deploy-cliente.result }}
          SYNC_BE_N: ${{ needs.sync-backend.outputs.synced }}
          SYNC_FE_N: ${{ needs.sync-frontend.outputs.synced }}
          SYNC_CLI_N: ${{ needs.sync-cliente.outputs.synced }}
          DEP_BE_ST: ${{ needs.deploy-backend.outputs.status }}
          DEP_FE_ST: ${{ needs.deploy-frontend.outputs.status }}
          DEP_CLI_ST: ${{ needs.deploy-cliente.outputs.status }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo PASS ;;
              failure) echo FAIL ;;
              cancelled) echo CANCEL ;;
              skipped) echo SKIP ;;
              *) echo "$1" ;;
            esac
          }

          row() {
            local label="$1" flag="$2" sync="$3" dep="$4" sync_n="$5" dep_st="$6"
            if [ "$flag" != "true" ]; then
              echo "| $label | SKIP | não afetado neste push |"
              return
            fi
            echo "| $label | sync \`$(icon "$sync")\` / deploy \`$(icon "$dep")\` | envs: ${sync_n:-—} · Coolify \`${dep_st:-—}\` |"
          }

          overall=success
          for r in "$GATE" "$SYNC_BE" "$SYNC_FE" "$SYNC_CLI" "$DEP_BE" "$DEP_FE" "$DEP_CLI"; do
            if [ "$r" = "failure" ]; then overall=failure; fi
            if [ "$r" = "cancelled" ] && [ "$overall" != "failure" ]; then overall=cancelled; fi
          done

          {
            echo "## Resumo da esteira"
            echo
            echo "| App | Status | Detalhe |"
            echo "| --- | --- | --- |"
            row "Backend" "$DEP_BE_FLAG" "$SYNC_BE" "$DEP_BE" "$SYNC_BE_N" "$DEP_BE_ST"
            row "Frontend" "$DEP_FE_FLAG" "$SYNC_FE" "$DEP_FE" "$SYNC_FE_N" "$DEP_FE_ST"
            row "Cliente" "$DEP_CLI_FLAG" "$SYNC_CLI" "$DEP_CLI" "$SYNC_CLI_N" "$DEP_CLI_ST"
            echo
            echo "**Resultado geral:** \`$overall\`"
            echo
            echo "| Link | |"
            echo "| --- | --- |"
            echo "| Actions | $RUN_URL |"
            echo "| Admin | https://clube.nutrisabellajardim.com.br |"
            echo "| API | https://apiclube.nutrisabellajardim.com.br |"
            echo "| Paciente | https://app.nutrisabellajardim.com.br |"
            echo "| Branch | \`$REF\` |"
          } >>"$GITHUB_STEP_SUMMARY"

          if [ "$DEP_BE_FLAG" != "true" ] && [ "$DEP_FE_FLAG" != "true" ] && [ "$DEP_CLI_FLAG" != "true" ]; then
            exit 0
          fi
          if [ "$overall" = "failure" ]; then exit 1; fi
          exit 0
